map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server { listen 80; server_name _; server_tokens off; client_max_body_size 32m;
  add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy no-referrer always; add_header Permissions-Policy "camera=(), geolocation=()" always;
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location /api/v1/ { proxy_pass http://backend:8000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 300s; }
  location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; add_header Cache-Control "no-store"; }
}
