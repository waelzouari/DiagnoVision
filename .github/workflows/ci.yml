name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest --disable-warnings --maxfail=1
        env:
          APP_ENV: test
          DEMO_MODE: "true"
          DATABASE_URL: sqlite+pysqlite:///./diagnovision-test.db
          JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
          SECURE_COOKIES: "false"
          WEB_ORIGIN: http://testserver

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build
      - name: Reject private credentials in browser bundle
        run: |
          if grep -R -E "JWT_SECRET|MINIO_SECRET_KEY|POSTGRES_PASSWORD|OPENAI_API_KEY" dist; then
            echo "Potential private configuration identifier found in frontend bundle"
            exit 1
          fi

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet

  browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - run: ./scripts/wait-for-http.sh http://localhost:8080/health 180
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

