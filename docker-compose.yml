name: diagnovision

services:
  gateway:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
      - private
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - private
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - private
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - private
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diagnovision}
      POSTGRES_USER: ${POSTGRES_USER:-diagnovision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diagnovision-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diagnovision} -d ${POSTGRES_DB:-diagnovision}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - private
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - private
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-diagnovision}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-local-only}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - private
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/bootstrap/create-private-bucket.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-diagnovision}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-local-only}
      MINIO_BUCKET: ${MINIO_BUCKET:-diagnovision-private}
    volumes:
      - ./infrastructure/minio/create-private-bucket.sh:/bootstrap/create-private-bucket.sh:ro
    networks:
      - private

  ollama:
    image: ollama/ollama:0.4.7
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    networks:
      - private
    restart: unless-stopped

networks:
  edge: {}
  private:
    internal: true

volumes:
  postgres_data: {}
  redis_data: {}
  minio_data: {}
  ollama_data: {}
